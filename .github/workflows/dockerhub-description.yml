# Keeps the Docker Hub repository overview in sync with README.md.
#
# Whenever a push touches README.md, its contents are uploaded as the
# repository's full_description via the Docker Hub API.
#
# Uses the same DOCKERHUB_TOKEN secret as the release workflow.

name: Docker Hub Description

on:
  push:
    paths:
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: dockerhub-description
  cancel-in-progress: true

env:
  REPO: drpsyko101/conch

jobs:
  update-description:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
            repository: my-namespace/my-repo
            short-description: "My project short description."
            readme-filepath: ./README.md
